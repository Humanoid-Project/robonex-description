controller_manager:
  ros__parameters:
    update_rate: 1000
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_effort_controller:
      type: effort_controllers/JointGroupEffortController

joint_trajectory_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - l_hip_yaw_joint
      - l_hip_pitch_joint
      - l_hip_roll_joint
      - l_knee_joint
      - l_ankle_roll_joint
      - l_ankle_pitch_joint
      - r_hip_yaw_joint
      - r_hip_pitch_joint
      - r_hip_roll_joint
      - r_knee_joint
      - r_ankle_roll_joint
      - r_ankle_pitch_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
    gains:
      l_hip_yaw_joint:    {p: 40.0, i: 0.0, d: 2.00, i_clamp: 0.0, ff_velocity_scale: 0.0}
      l_hip_pitch_joint:  {p: 40.0, i: 0.0, d: 2.00, i_clamp: 0.0, ff_velocity_scale: 0.0}
      l_hip_roll_joint:   {p: 40.0, i: 0.0, d: 2.00, i_clamp: 0.0, ff_velocity_scale: 0.0}
      l_knee_joint:       {p: 80.5, i: 0.0, d: 4.02, i_clamp: 0.0, ff_velocity_scale: 0.0}
      l_ankle_roll_joint:      {p: 77.7, i: 0.0, d: 3.88, i_clamp: 0.0, ff_velocity_scale: 0.0}
      l_ankle_pitch_joint: {p: 79.8, i: 0.0, d: 3.99, i_clamp: 0.0, ff_velocity_scale: 0.0}
      r_hip_yaw_joint:    {p: 40.0, i: 0.0, d: 2.00, i_clamp: 0.0, ff_velocity_scale: 0.0}
      r_hip_pitch_joint:  {p: 40.0, i: 0.0, d: 2.00, i_clamp: 0.0, ff_velocity_scale: 0.0}
      r_hip_roll_joint:   {p: 40.0, i: 0.0, d: 2.00, i_clamp: 0.0, ff_velocity_scale: 0.0}
      r_knee_joint:       {p: 80.5, i: 0.0, d: 4.02, i_clamp: 0.0, ff_velocity_scale: 0.0}
      r_ankle_roll_joint:      {p: 77.7, i: 0.0, d: 3.88, i_clamp: 0.0, ff_velocity_scale: 0.0}
      r_ankle_pitch_joint: {p: 79.8, i: 0.0, d: 3.99, i_clamp: 0.0, ff_velocity_scale: 0.0}

joint_effort_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - l_hip_yaw_joint
      - l_hip_pitch_joint
      - l_hip_roll_joint
      - l_knee_joint
      - l_ankle_roll_joint
      - l_ankle_pitch_joint
      - r_hip_yaw_joint
      - r_hip_pitch_joint
      - r_hip_roll_joint
      - r_knee_joint
      - r_ankle_roll_joint
      - r_ankle_pitch_joint
